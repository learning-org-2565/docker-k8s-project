apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  labels:
    purpose: payment-process
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:                    # ← Fixed typo
      maxSurge: 2
      maxUnavailable: 1
  minReadySeconds: 20
  progressDeadlineSeconds: 600        # ← Fixed typo
  selector:
    matchLabels:
      purpose: payment-process
  template:
    metadata:
      labels: 
        purpose: payment-process
    spec:
      terminationGracePeriodSeconds: 90   # ← Fixed typo
      containers:
      - name: nginx
        image: nginx:1.24
        ports:
        - containerPort: 80             # ← Fixed port
        resources:                       # ← Fixed indentation
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m                    # ← Allow burst capacity
            memory: 256Mi
        readinessProbe:                  # ← Fixed indentation
          httpGet:
            path: /
            port: 80                     # ← Matches containerPort
          initialDelaySeconds: 10        # ← Reduced (nginx starts fast)
          periodSeconds: 5
          failureThreshold: 3