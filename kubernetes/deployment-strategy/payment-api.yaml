apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  labels:
    purpose: payment-process
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingupdate:
      maxSurge: 2   # Can handle extra load
      maxUnavailable: 1  # Only 1 pod down at a time
  minReadySeconds: 20    # Ensure new pod stable
  progressDeadLineSeconds: 600
  selector:
    matchLabels:
      purpose: payment-process
  template:
    metadata:
      labels: 
        purpose: payment-process
    spec:
      terminationGracePeriodSecounds: 90   # Payment can take up to 90s
      containers:
        - name: nginx
          image: nginx:1.24
          ports:
            - containerPort: 5000
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 100m
          memory: 128Mi
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 30
        periodSeconds: 5
        failureThreshold: 3


