apiVersion: v1
kind: Service
metadata:
  name: postgres-db
  namespace: food-delivery
  labels:
    app: database
spec:
  type: ClusterIP  # Your design choice!
  ports:
  - port: 5432        # Service port (what others call)
    targetPort: 5432  # Pod port (where PostgreSQL listens)
    protocol: TCP
    name: postgres
  selector:
    app: database  # CRITICAL: Must match Pod labels!