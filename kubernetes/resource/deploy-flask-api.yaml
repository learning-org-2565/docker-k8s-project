apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-resource
  labels:
    app: flask-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-api
  
  template:
    metadata:
      labels:
        app: flask-api
    spec:
      containers:
        - name: python-app
          image: python:3.11-slim
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m # *2x safety margin
              memory: 256Mi # *2x
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3