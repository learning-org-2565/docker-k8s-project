apiVersion: v1
kind: Pod
metadata:
  name: impossible-pod
spec:
  containers:
  - name: greedy
    image: nginx
    resources:
      requests:
        cpu: "100"      # Asking for 100 CPUs!
        memory: "500Gi" # Asking for 500GB RAM!
      limits:
        cpu: "100"
        memory: "500Gi"
# ```

