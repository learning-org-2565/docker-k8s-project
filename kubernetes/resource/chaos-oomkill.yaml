apiVersion: v1
kind: Pod
metadata:
  name: oomkill-test
spec:
  containers:
  - name: memory-hog
    image: polinux/stress
    command: ["stress"]
    args: ["--vm", "1", "--vm-bytes", "150M", "--timeout", "60s"]
    resources:
      limits:
        memory: "50Mi"  # Limit 50Mi, but tries to use 150Mi!
# ```

# **What will happen?**
# ```
# Container tries: 150Mi allocation
# Kernel allows: Only 50Mi (the limit)
# Result: OOMKilled (Out Of Memory Killed)