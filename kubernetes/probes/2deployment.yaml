apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-probes
  labels:
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.26
          ports:
          - containerPort: 80
          readinessProbe:
            httpGet:
              - path: /
                port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              - path: /
                port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3