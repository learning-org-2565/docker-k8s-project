# frontend/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: fintech
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend  # ✅ Fixed!
      tier: frontend
  template:
    metadata:
      labels:
        app: frontend  # ✅ Fixed!
        tier: frontend
    spec:
      containers:
      - name: frontend
        image: nginx:1.26
        ports:
        - containerPort: 80  # ✅ Fixed!
        env:
        - name: BACKEND_API_URL
          value: "http://payment-api"  # ✅ Service name
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"