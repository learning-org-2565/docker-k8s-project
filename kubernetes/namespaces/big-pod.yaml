apiVersion: v1
kind: Pod
metadata:
  name: small-pod
  namespace: payment-ns
spec:
  containers:
  - name: nginx
    image: nginx:1.25
    resources:
      requests:
        cpu: "500m"
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi