apiVersion: v1
kind: LimitRange
metadata:
  name: payment-limitrange
  namespace: payment-ns
spec:
  limits:
  - type: Container
    max:
      cpu: "2"
      memory: 4Gi
    min:
      cpu: "100m"
      memory: 256Mi
    default:
      cpu: "500m"
      memory: 1Gi
    defaultRequest:
      cpu: "200m"
      memory: 512Mi
# ```

# **What each field does:**
# ```
# max:            → No container can set limits HIGHER than this
# min:            → No container can set requests LOWER than this
# default:        → If container doesn't set limits, USE THIS
# defaultRequest: → If container doesn't set requests, USE THIS
---
# apiVersion: v1
# kind: Pod
# metadata:
#   name: no-limits-pod
#   namespace: payment-ns
# spec:
#   containers:
#   - name: nginx
#     image: nginx:1.25

---
apiVersion: v1
kind: Pod
metadata:
  name: chaos-pod-1
  namespace: payment-ns
spec:
  containers:
  - name: nginx
    image: nginx:1.25
    resources:
      requests:
        cpu: "1"
        memory: 1Gi
      limits:
        cpu: "4"        # ← Exceeds LimitRange max (2 CPU)
        memory: 2Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: chaos-pod-2
  namespace: payment-ns
spec:
  containers:
  - name: nginx
    image: nginx:1.25
    resources:
      requests:
        cpu: "10m"      # ← Below LimitRange min (100m)
        memory: 128Mi   # ← Below LimitRange min (256Mi)
      limits:
        cpu: "500m"
        memory: 1Gi