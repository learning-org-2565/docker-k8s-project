apiVersion: v1
kind: LimitRange
metadata:
  name: payment-limitrange
  namespace: payment-ns
spec:
  limits:
  - type: Container
    max:
      cpu: "2"
      memory: 4Gi
    min:
      cpu: "100m"
      memory: 256Mi
    default:
      cpu: "500m"
      memory: 1Gi
    defaultRequest:
      cpu: "200m"
      memory: 512Mi
# ```

# **What each field does:**
# ```
# max:            → No container can set limits HIGHER than this
# min:            → No container can set requests LOWER than this
# default:        → If container doesn't set limits, USE THIS
# defaultRequest: → If container doesn't set requests, USE THIS