apiVersion: apps/v1
kind: ReplicaSets
metadata:
  name: muscle-memory
  labels:
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: service-node
spec:
  selector:
    name: nginx
  ports:
  - port: 80
    targetPort: 80
  type: NodePort
