apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: replica
  labels:
    name: rep-lib
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
      tier: backend
  template:
    metadata:
      labels:
        app: nginx
        tier: backend
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
          - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: replica-service
spec:
  selector:
    tier: backend
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP