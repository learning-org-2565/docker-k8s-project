apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: testing1
  labels:
    name: replica 
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
          - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: service-replica
spec:
  selector:
    app: nginx
  ports:
  - port: 80
    targetPort: 80
  type: NodePort